<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>MornSaveSaver 管理</title>
  <link rel="stylesheet" href="/admin.css">
  <script src="/admin.js" defer></script>
</head>
<body>
  <main>
    <h1>MornSaveSaver</h1>
    <p id="status" role="status" aria-live="polite"></p>
    <section class="panel">
      <form id="search" class="row">
        <label for="project">プロジェクト</label><input id="project" required maxlength="64" placeholder="project_id">
        <button>一覧を表示</button>
      </form>
      <form id="exact" class="row">
        <label for="save-id">Save ID</label><input id="save-id" placeholder="UUID">
        <button>完全一致で検索</button>
      </form>
      <ul id="items"></ul>
      <button id="more" type="button" hidden>次のページ</button>
    </section>
    <p><a href="https://tsukumistudio.cloudflareaccess.com/cdn-cgi/access/logout">Cloudflare Accessからログアウト</a></p>
  </main>
</body>
</html>
