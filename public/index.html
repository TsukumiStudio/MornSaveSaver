<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>GMornSaveServer 管理</title>
  <link rel="stylesheet" href="/admin.css">
  <script src="/admin.js" defer></script>
</head>
<body>
  <main>
    <h1>GMornSaveServer</h1>
    <p id="status" role="status" aria-live="polite"></p>
    <section class="panel">
      <form id="search" class="row">
        <label for="project">プロジェクト</label><select id="project" required></select>
      </form>
      <div id="history-bar" class="row" hidden>
        <button id="back" type="button">← 一覧へ戻る</button><span id="history-title"></span>
      </div>
      <ul id="items"></ul>
      <button id="more" type="button" hidden>次のページ</button>
    </section>
  </main>
</body>
</html>
